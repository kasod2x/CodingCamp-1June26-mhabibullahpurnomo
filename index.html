<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <!-- Top bar: Dark mode toggle -->
    <div class="topbar">
        <span class="topbar-title">Dashboard</span>
        <button class="btn btn-secondary icon-btn" id="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode">🌙</button>
    </div>

    <!-- Clock -->
    <div class="card clock-card">
        <div id="clock">00:00:00</div>
        <div id="date"></div>
        <div id="greeting">Good Morning</div>
        <div class="name-row">
            <span id="display-name" class="display-name"></span>
            <button class="btn btn-secondary icon-btn" id="edit-name-btn" onclick="openNameEditor()" title="Edit name">✏️</button>
        </div>
        <!-- Inline name editor (hidden by default) -->
        <div class="name-editor" id="name-editor" style="display:none;">
            <input type="text" id="name-input" placeholder="Enter your name...">
            <button class="btn btn-primary" onclick="saveName()">Save</button>
            <button class="btn btn-secondary" onclick="closeNameEditor()">Cancel</button>
        </div>
    </div>

    <!-- Row: Timer + Tasks -->
    <div class="row">

        <!-- Focus Timer -->
        <div class="card timer-card">
            <h2>Focus Timer</h2>
            <div id="timer-display">25:00</div>
            <!-- Pomodoro duration setter -->
            <div class="pomodoro-set">
                <label for="pomodoro-minutes">Minutes:</label>
                <input type="number" id="pomodoro-minutes" min="1" max="120" value="25">
                <button class="btn btn-secondary" onclick="applyPomodoroTime()">Set</button>
            </div>
            <div class="timer-btns">
                <button class="btn btn-primary" onclick="startTimer()">Start</button>
                <button class="btn btn-secondary" onclick="stopTimer()">Stop</button>
                <button class="btn btn-secondary" onclick="resetTimer()">Reset</button>
            </div>
        </div>

        <!-- Tasks -->
        <div class="card tasks-card">
            <h2>Tasks</h2>
            <div class="task-input-row">
                <input type="text" id="task-input" placeholder="Add a new task...">
                <button class="btn btn-primary" onclick="addTask()">Add</button>
            </div>
            <ul id="task-list"></ul>
        </div>

    </div>

    <!-- Quick Links (full width below) -->
    <div class="card links-card">
        <h2>Quick Links</h2>
        <div class="link-input-row">
            <input type="text" id="link-name" placeholder="Link name">
            <input type="text" id="link-url" placeholder="URL">
            <button class="btn btn-primary" onclick="addLink()">Add Link</button>
        </div>
        <div id="link-list"></div>
    </div>

    <script src="dashboard.js"></script>

</body>
</html>
